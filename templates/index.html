<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>訪問振替支援アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">訪問振替支援アプリ</h1>
        <p class="text-muted">急な欠勤時の振替候補を自動表示します</p>
    </div>

    <!-- メインボタン -->
    <div class="d-grid gap-3 col-6 mx-auto mb-5">
        <a href="/start" class="btn btn-primary btn-lg">振替を開始する</a>
    </div>

    <hr>

    <!-- 減点操作エリア -->
    <div class="card mt-4">
        <div class="card-header bg-danger text-white">
            減点操作
        </div>
        <div class="card-body text-center">
            <p>特定スタッフのスコアを一時的に減点します</p>
            <button class="btn btn-danger">減点する</button>
        </div>
    </div>

</div>

</body>
<h1>トップ画面</h1>

<a href="/staff_adjust">
    <button>スタッフ減点設定</button>
</a>

</html>
