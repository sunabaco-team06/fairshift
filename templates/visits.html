<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>訪問一覧</title>
</head>
<body>
  <h1>訪問一覧</h1>
  <p>欠勤スタッフID：{{ staff_id }}</p>
  <p>日付：{{ date }}</p>

  <hr>

  <h2>デバッグ</h2>
  <p>visits 件数：{{ visits|length }}</p>

  <hr>

  {% if visits|length == 0 %}
    <p>この条件の訪問はありません（データ0件）</p>
  {% else %}
    <table border="1" cellpadding="8">
      <thead>
        <tr>
          <th>時間</th>
          <th>利用者名</th>
          <th>エリア名</th>
        </tr>
      </thead>
      <tbody>
        {% for v in visits %}
        <tr>
          <td>{{ v["visit_time"] }}</td>
          <td>{{ v["user_name"] }}</td>
          <td>{{ v["area_name"] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endif %}

  <p><a href="/absent">← 欠勤スタッフ選択に戻る</a></p>
</body>
</html>
