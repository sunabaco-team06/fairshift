<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>スタッフ一覧</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h1 class="mb-4">スタッフ一覧</h1>

  <table class="table table-bordered table-striped">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>名前</th>
        <th>性別</th>
        <th>職種</th>
        <th>登録日時</th>
      </tr>
    </thead>
    <tbody>
      {% for s in staff %}
      <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.gender }}</td>
        <td>{{ s.role }}</td>
        <td>{{ s.created_at }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="/" class="btn btn-secondary">トップへ戻る</a>
</div>

</body>
</html>
