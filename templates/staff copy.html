<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>スタッフ一覧</title>
</head>
<body>
  <h1>スタッフ一覧</h1>

  <table border="1" cellpadding="6">
    <tr>
      <th>ID</th>
      <th>名前</th>
      <th>性別</th>
      <th>職種</th>
      <th>登録日時</th>
    </tr>

    {% for s in staff %}
    <tr>
      <td>{{ s.id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.gender }}</td>
      <td>{{ s.role }}</td>
      <td>{{ s.created_at }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
